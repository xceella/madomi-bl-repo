name: Audit XBL sources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'audit/config.json'
      - 'audit/run_audit.py'
      - 'audit/run_audit_v2.py'
      - 'audit/check_active_sources.py'
      - 'index.json'
      - '.github/workflows/audit-sources.yml'
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write

concurrency:
  group: audit-xbl-sources
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Rodar auditoria
        run: python audit/run_audit_v2.py

      - name: Verificar todas as fontes ativas do catálogo
        run: python audit/check_active_sources.py

      - name: Publicar relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/results/latest.json audit/results/latest.md audit/results/health.json audit/results/health.md

          if git diff --cached --quiet; then
            echo "Relatório sem alterações."
            exit 0
          fi

          git commit -m "Update XBL source audit report"

          # Other workflows may update index.json concurrently. Rebase before
          # publishing and retry a short race instead of losing the audit.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push concorrente na tentativa $attempt; repetindo."
            sleep 3
          done

          echo "::error::Não foi possível publicar o relatório após 3 tentativas."
          exit 1
