name: Audit XBL sources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'audit/config.json'
      - 'audit/run_audit.py'
      - '.github/workflows/audit-sources.yml'
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write

concurrency:
  group: audit-xbl-sources
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Rodar auditoria
        run: python audit/run_audit.py

      - name: Publicar relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/results/latest.json audit/results/latest.md

          if git diff --cached --quiet; then
            echo "Relatório sem alterações."
            exit 0
          fi

          git commit -m "Update XBL source audit report"
          git push
