name: Build XBL Mihon PT-BR catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'catalog/sources.json'
      - 'custom/**'
      - 'tools/update_owned_index.py'
      - 'tools/index.proto'
      - '.github/workflows/build-xbl-catalog.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: build-xbl-root-catalog-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout do nosso repositório
        uses: actions/checkout@v4

      - name: Cancelar builds anteriores do catálogo
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          gh run list --workflow build-xbl-catalog.yml --limit 20 --json databaseId,status |
            jq -r --arg current "$CURRENT_RUN_ID" '.[] | select((.databaseId | tostring) != $current and (.status == "in_progress" or .status == "queued")) | .databaseId' |
            while IFS= read -r run_id; do
              echo "Cancelando execução anterior $run_id"
              gh run cancel "$run_id" || true
            done

      - name: Baixar o código-fonte do Keiyoushi
        run: |
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git upstream

      - name: Confirmar domínio da Fleur Blanche
        run: |
          FILE=upstream/src/pt/fleurblanche/build.gradle.kts
          grep -q 'baseUrl = "https://fbsscan.com"' "$FILE" || { echo '::error::Domínio upstream inesperado para Fleur Blanche'; exit 1; }
          echo 'Fleur Blanche: fbsscan.com confirmado; versão será calculada sem downgrade.'

      - name: Sobrepor extensões próprias XBL
        run: |
          while IFS= read -r row; do
            CUSTOM=$(echo "$row" | jq -r '.custom // empty')
            MODULE=$(echo "$row" | jq -r '.module')
            ICON_URL=$(echo "$row" | jq -r '.iconUrl // empty')

            if [ -z "$CUSTOM" ]; then
              continue
            fi

            echo "Instalando módulo próprio: $CUSTOM -> $MODULE"
            rm -rf "upstream/$MODULE"
            mkdir -p "upstream/$MODULE"
            cp -R "$CUSTOM"/. "upstream/$MODULE"/

            mkdir -p "upstream/$MODULE/res/mipmap-xhdpi"
            if [ -n "$ICON_URL" ]; then
              ICON_PATH="upstream/$MODULE/res/mipmap-xhdpi/ic_launcher.png"
              if ! curl --connect-timeout 10 --max-time 20 -fL "$ICON_URL" -o "$ICON_PATH"; then
                if [ "$MODULE" = "src/pt/bodinhoyaoi" ]; then
                  echo "::warning::Ícone oficial do Bodinho indisponível; usando ícone temporário da XXX Yaoi nesta build."
                  curl --connect-timeout 10 --max-time 30 -fL "https://raw.githubusercontent.com/keiyoushi/extensions-source/main/src/pt/xxxyaoi/res/mipmap-xhdpi/ic_launcher.png" -o "$ICON_PATH"
                else
                  echo "::error::Não foi possível baixar o ícone configurado para $MODULE."
                  exit 1
                fi
              fi
            fi
          done < <(jq -c '.[]' catalog/sources.json)

      - name: Sincronizar versões de todas as extensões com o catálogo publicado
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          catalog = json.loads(Path("catalog/sources.json").read_text(encoding="utf-8"))
          published = json.loads(Path("index.json").read_text(encoding="utf-8"))["extensionList"]["extensions"]
          previous = {e["packageName"]: e for e in published}
          targets = {}

          for source in catalog:
              slug = source["slug"]
              package = "eu.kanade.tachiyomi.extension.pt." + slug
              old = previous.get(package)
              if old is None:
                  raise SystemExit(f"::error::Extensão ausente no catálogo publicado: {package}")
              gradle = Path("upstream") / source["module"] / "build.gradle.kts"
              text = gradle.read_text(encoding="utf-8")
              match = re.search(r"(?m)^(\s*versionCode\s*=\s*)(\d+)", text)
              library = re.search(r'libVersion\s*=\s*"(\d+\.\d+)"', text)
              if not match or not library:
                  raise SystemExit(f"::error::Gradle sem versão válida: {gradle}")
              prefix = library.group(1) + "."
              if not old["versionName"].startswith(prefix):
                  raise SystemExit(f"::error::Versão publicada incompatível: {slug}, {old['versionName']}")
              old_revision = int(old["versionName"][len(prefix):])
              upstream_revision = int(match.group(2))
              new_revision = max(old_revision, upstream_revision) + 1
              text = text[:match.start(2)] + str(new_revision) + text[match.end(2):]
              gradle.write_text(text, encoding="utf-8")
              targets[package] = prefix + str(new_revision)
              print(f"{slug}: {old['versionName']} -> {targets[package]} (base={upstream_revision})")

          if len(targets) != len(catalog):
              raise SystemExit("::error::Nem todas as extensões foram versionadas.")
          Path("version-targets.json").write_text(json.dumps(targets, indent=2), encoding="utf-8")
          PY

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar nossa chave de assinatura
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::O secret SIGNING_KEY não está configurado."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 -d > upstream/signingkey.jks

      - name: Detectar alias da nossa chave
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          if [ -z "$KEY_STORE_PASSWORD" ]; then
            echo "::error::O secret KEY_STORE_PASSWORD não está configurado."
            exit 1
          fi

          DETECTED_ALIAS=$(keytool -list -v \
            -keystore upstream/signingkey.jks \
            -storepass "$KEY_STORE_PASSWORD" \
            | sed -n 's/^Alias name: //p' \
            | head -1)

          if [ -z "$DETECTED_ALIAS" ]; then
            echo "::error::Não foi possível detectar o alias da keystore."
            exit 1
          fi

          echo "ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
          echo "Alias detectado com sucesso."

      - name: Validar catálogo configurado
        run: |
          COUNT=$(jq 'length' catalog/sources.json)
          if ! jq -e 'all(.[]; (.module | startswith("src/pt/")) and (.slug | length > 0))' catalog/sources.json >/dev/null; then
            echo "::error::O catálogo Mihon XBL só pode conter módulos PT-BR (src/pt/)."
            exit 1
          fi
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::O catálogo está vazio."
            exit 1
          fi
          echo "EXPECTED_COUNT=$COUNT" >> "$GITHUB_ENV"

          while read -r module; do
            if [ ! -f "upstream/${module}/build.gradle.kts" ]; then
              echo "::error::Módulo não encontrado: ${module}"
              exit 1
            fi
          done < <(jq -r '.[].module' catalog/sources.json)

      - name: Compilar catálogo com nossa assinatura
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::O secret KEY_PASSWORD não está configurado."
            exit 1
          fi

          TASKS=()
          while read -r module; do
            gradle_module=":${module//\//:}:assembleRelease"
            TASKS+=("$gradle_module")
          done < <(jq -r '.[].module' catalog/sources.json)

          cd upstream
          chmod +x ./gradlew
          ./gradlew "${TASKS[@]}"

      - name: Conferir versões e pacotes compilados antes da publicação
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("catalog/sources.json").read_text(encoding="utf-8"))
          targets = json.loads(Path("version-targets.json").read_text(encoding="utf-8"))
          for entry in catalog:
              info_path = Path("upstream") / entry["module"] / "build/keiyoushi-source-info.json"
              info = json.loads(info_path.read_text(encoding="utf-8"))
              pkg = info["packageName"]
              expected = targets.get(pkg)
              if expected is None or info["versionName"] != expected:
                  raise SystemExit(f"::error::Build divergente: {entry['slug']} -> {pkg} {info['versionName']}; esperado={expected}")
              if not info.get("sources") or any(s["lang"] != "pt-BR" for s in info["sources"]):
                  raise SystemExit(f"::error::Fonte fora do escopo PT-BR: {entry['slug']}")
              print(f"OK: {info['name']} {info['versionName']} ({pkg})")
          PY

      - name: Calcular fingerprint da nossa assinatura
        id: fingerprint
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          FP=$(keytool -list -v \
            -keystore upstream/signingkey.jks \
            -storepass "$KEY_STORE_PASSWORD" \
            -alias "$ALIAS" \
            -keypass "$KEY_PASSWORD" \
            | grep "SHA256:" | head -1 | awk '{print $2}')

          if [ -z "$FP" ]; then
            echo "::error::Não foi possível obter o fingerprint da assinatura."
            exit 1
          fi

          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Preparar gerador do index.pb
        run: |
          python -m pip install --disable-pip-version-check protobuf grpcio-tools
          cd tools
          python -m grpc_tools.protoc --proto_path=. --python_out=. index.proto
          cd ..
          rm -rf generated-root
          mkdir -p generated-root

      - name: Publicar nossas builds e montar o catálogo raiz
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          while IFS= read -r row; do
            SLUG=$(echo "$row" | jq -r '.slug')
            MODULE=$(echo "$row" | jq -r '.module')
            CUSTOM=$(echo "$row" | jq -r '.custom // empty')
            CONFIGURED_ICON=$(echo "$row" | jq -r '.iconUrl // empty')

            INFO="upstream/${MODULE}/build/keiyoushi-source-info.json"
            APK=$(find "upstream/${MODULE}/build/outputs/apk/release" -name '*.apk' | head -1)
            JAR=$(find "upstream/${MODULE}/build/outputs/jar/release" -name '*.jar' | head -1)

            if [ ! -f "$INFO" ] || [ -z "$APK" ] || [ -z "$JAR" ]; then
              echo "::error::Artefatos ausentes para ${SLUG}."
              exit 1
            fi

            if ! jq -e '(.sources | length > 0) and (.sources | all(.[]; .lang == "pt-BR"))' "$INFO" >/dev/null; then
              echo "::error::A extensão ${SLUG} declarou idioma diferente de pt-BR."
              exit 1
            fi

            VERSION=$(jq -r '.versionName' "$INFO")
            NAME=$(jq -r '.name' "$INFO")
            TAG="xbl-${SLUG}-v${VERSION}"
            APK_NAME=$(basename "$APK")
            JAR_NAME=$(basename "$JAR")

            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK" "$JAR" --clobber
            else
              if [ -n "$CUSTOM" ]; then
                NOTES="Build própria do Xceella BL Repo, compilada e assinada pela infraestrutura XBL."
              else
                NOTES="Build compilada e assinada pelo Xceella BL Repo. Código-base: keiyoushi/extensions-source (Apache-2.0)."
              fi
              gh release create "$TAG" "$APK" "$JAR" \
                --title "${NAME} ${VERSION} — XBL Mihon PT-BR" \
                --notes "$NOTES"
            fi

            APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
            JAR_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${JAR_NAME}"
            if [ -n "$CONFIGURED_ICON" ]; then
              ICON_URL="$CONFIGURED_ICON"
            else
              ICON_URL="https://raw.githubusercontent.com/keiyoushi/extensions-source/main/${MODULE}/res/mipmap-xhdpi/ic_launcher.png"
            fi

            python tools/update_owned_index.py \
              --info "$INFO" \
              --apk-url "$APK_URL" \
              --jar-url "$JAR_URL" \
              --icon-url "$ICON_URL" \
              --fingerprint "$FINGERPRINT" \
              --output-dir generated-root \
              --index-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/index.pb" \
              --name "XBL — Mihon PT-BR" \
              --badge-label "XBL"
          done < <(jq -c '.[]' catalog/sources.json)

      - name: Validar catálogo final
        run: |
          if ! jq -e '(.extensionList.extensions | all(.[]; (.sources | length > 0) and (.sources | all(.[]; .language == "pt-BR"))))' generated-root/index.json >/dev/null; then
            echo "::error::Catálogo gerado contém fontes não PT-BR."
            exit 1
          fi
          COUNT=$(jq '.extensionList.extensions | length' generated-root/index.json)
          if [ "$COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "::error::O catálogo final deveria conter $EXPECTED_COUNT extensões, mas contém $COUNT."
            exit 1
          fi

          echo "Catálogo final contém $COUNT extensões assinadas pela nossa chave."

      - name: Promover catálogo próprio para a raiz
        run: |
          cp generated-root/index.pb index.pb
          cp generated-root/index.json index.json
          cp generated-root/repo.json repo.json

      - name: Salvar catálogo raiz no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pb index.json repo.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no catálogo raiz."
            exit 0
          fi

          git commit -m "Build XBL root catalog with owned signatures"
          git push

      - name: Remover nossa chave do runner
        if: always()
        run: rm -f upstream/signingkey.jks
