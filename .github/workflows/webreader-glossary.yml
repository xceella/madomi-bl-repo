name: Build XBL Web Reader glossary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit/glossary_titles.json'
      - 'audit/webreader_glossary.py'
      - '.github/workflows/webreader-glossary.yml'

permissions:
  contents: write

concurrency:
  group: xbl-webreader-glossary
  cancel-in-progress: true

jobs:
  webreader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Scan Web Readers
        run: python audit/webreader_glossary.py
      - uses: actions/upload-artifact@v4
        with:
          name: webreader-glossary
          path: |
            audit/results/webreader_glossary.json
            audit/results/webreader_glossary.csv
            audit/results/webreader_glossary.md
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/results/webreader_glossary.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Web Reader glossary"
          git push
