name: Diagnose Portal Yaoi public page
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portal-live-diag.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public page and summarize markup
        run: |
          python - <<'PY'
          import re, urllib.request, json, pathlib
          from html.parser import HTMLParser
          class H(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if tag=='a':
                      self.links.append({'href':attrs.get('href',''),'class':attrs.get('class',''),'title':attrs.get('title','')})
          urls=['https://portalyaoi.com/manga/cherry-blossoms-after-winter/','https://portalyaoi.com/manga/blossoms-of-the-white-night/']
          out=[]
          for url in urls:
              rec={'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8','Accept-Language':'pt-BR,pt;q=0.9,en;q=0.8'})
                  with urllib.request.urlopen(req,timeout=22) as response:
                      data=response.read(1000000).decode('utf-8','replace')
                      rec['status']=response.status
                      rec['bytes']=len(data)
                      rec['preview']=data[:1000]
                      rec['has_chapters_heading']='Capítulos' in data
                      rec['has_json_next']='__NEXT_DATA__' in data
                      rec['has_flight']='self.__next_f' in data
                      p=H()
                      p.feed(data)
                      rec['num_links']=len(p.links)
                      rec['links_chapter_candidates']=[l for l in p.links if any(x in (l['href']+' '+l['class']).lower() for x in ['capitulo','chapter','epis','leitor','reader','side-','manga/'])][:140]
                      rec['tags_around_chapters']=[data[max(0,m.start()-300):m.start()+700] for m in list(re.finditer('Capítulos|chapter-list|chapter-item|Ler Primeiro|Side Story',data,re.I))[:12]]
              except Exception as e:
                  rec['error']=str(e)
              out.append(rec)
          pathlib.Path('audit').mkdir(exist_ok=True)
          pathlib.Path('audit/portal-live-diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps([{k:v for k,v in x.items() if k not in ('links_chapter_candidates','tags_around_chapters')} for x in out],ensure_ascii=False))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/portal-live-diagnostic.json
          git diff --cached --quiet || (git commit -m "Document live Portal Yaoi chapter markup" && git push)
